<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADS - Accurate Detection Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .background-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(0, 123, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, rgba(0, 123, 255, 0.1) 0%, transparent 50%),
                linear-gradient(45deg, rgba(0, 123, 255, 0.05) 25%, transparent 25%),
                linear-gradient(-45deg, rgba(0, 123, 255, 0.05) 25%, transparent 25%);
            background-size: 100% 100%, 100% 100%, 60px 60px, 60px 60px;
            z-index: -1;
        }

        .landing-container {
            text-align: center;
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .brand-title {
            color: #00d4ff;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
        }

        .main-title {
            color: #ffffff;
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1.2rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .upload-card {
            background: #2a2a3e;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .upload-card h3 {
            color: #ffffff;
            font-size: 1.5rem;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .file-input-wrapper {
            background: #1a1a2e;
            border: 2px dashed #4a4a6a;
            border-radius: 10px;
            padding: 30px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .file-input-wrapper:hover {
            border-color: #00d4ff;
            background: #1e1e35;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-input-label {
            color: #a0a0a0;
            cursor: pointer;
            display: block;
        }

        .file-input-label i {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #00d4ff;
        }

        .analyze-btn {
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
            width: 100%;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 212, 255, 0.4);
        }

        .analyze-btn:disabled {
            background: #4a4a6a;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .file-info {
            color: #6a6a8a;
            font-size: 0.9rem;
            margin-top: 15px;
        }

        .model-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .model-btn {
            background: rgba(0, 212, 255, 0.1);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .model-btn:hover, .model-btn.active {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .error-message {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            color: #51cf66;
            background: rgba(81, 207, 102, 0.1);
            border: 1px solid #51cf66;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading-spinner i {
            color: #00d4ff;
            font-size: 2rem;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .file-name {
            color: #00d4ff;
            font-weight: 500;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="background-pattern"></div>
    
    <div class="landing-container">
        <div style="position: absolute; top: 20px; right: 20px;">
            <a href="/auth/login" style="color: #00d4ff; text-decoration: none; font-weight: 500;">
                <i class="fas fa-sign-in-alt"></i> Login
            </a>
        </div>
        
        <h1 class="brand-title">ACCURATE DETECTION SERVICES</h1>
        <h2 class="main-title">Upload Transactions</h2>
        <p class="subtitle">AI-Powered Money Laundering Detection • 5 ML Models</p>
        
        <div class="upload-card">
            <h3>Upload Transactions (CSV)</h3>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <div class="file-input-wrapper">
                <label for="fileInput" class="file-input-label">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>Click to select file or drag and drop</p>
                </label>
                <input type="file" id="fileInput" accept=".csv,.xlsx,.xls">
                <p class="file-name" id="fileName"></p>
            </div>
            
            <div class="model-buttons">
                <button class="model-btn active" data-model="random_forest">Random Forest</button>
                <button class="model-btn" data-model="xgboost">XGBoost</button>
                <button class="model-btn" data-model="isolation_forest">Isolation Forest</button>
                <button class="model-btn" data-model="svm">One-Class SVM</button>
                <button class="model-btn" data-model="logistic_regression">Logistic Regression</button>
            </div>
            
            <button class="analyze-btn" id="analyzeBtn" disabled>Analyze Transactions</button>
            
            <p class="file-info">Supports CSV • XLSX • Max 50MB</p>
            
            <div class="loading-spinner" id="loadingSpinner">
                <i class="fas fa-spinner"></i>
                <p style="color: #a0a0a0; margin-top: 10px;">Processing your data...</p>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const modelButtons = document.querySelectorAll('.model-btn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const loadingSpinner = document.getElementById('loadingSpinner');
        
        let selectedModel = 'random_forest';
        let selectedFile = null;

        // File input change handler
        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileName.textContent = selectedFile.name;
                fileName.style.display = 'block';
                analyzeBtn.disabled = false;
                hideMessages();
            }
        });

        // Model button selection
        modelButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                modelButtons.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedModel = this.dataset.model;
            });
        });

        // Analyze button click
        analyzeBtn.addEventListener('click', async function() {
            if (!selectedFile) {
                showError('Please select a file first');
                return;
            }

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('model', selectedModel);

            analyzeBtn.disabled = true;
            loadingSpinner.style.display = 'block';
            hideMessages();

            try {
                const response = await fetch('/upload/upload', {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest'
                    }
                });

                // Check if response is JSON
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    // Server returned HTML (likely login page)
                    showError('Please login first to upload files. Redirecting to login page...');
                    setTimeout(() => {
                        window.location.href = '/auth/login';
                    }, 2000);
                    return;
                }

                const data = await response.json();

                if (response.ok) {
                    showSuccess('File uploaded successfully! Redirecting to dashboard...');
                    setTimeout(() => {
                        window.location.href = '/dashboard/dashboard';
                    }, 2000);
                } else {
                    if (response.status === 401) {
                        showError('Please login first. Redirecting to login page...');
                        setTimeout(() => {
                            window.location.href = '/auth/login';
                        }, 2000);
                    } else {
                        showError(data.error || 'Upload failed. Please try again.');
                    }
                }
            } catch (error) {
                showError('An error occurred. Please try again.');
                console.error('Upload error:', error);
            } finally {
                analyzeBtn.disabled = false;
                loadingSpinner.style.display = 'none';
            }
        });

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            successMessage.style.display = 'none';
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = 'block';
            errorMessage.style.display = 'none';
        }

        function hideMessages() {
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
        }

        // Drag and drop support
        const dropZone = document.querySelector('.file-input-wrapper');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#00d4ff';
            dropZone.style.background = '#1e1e35';
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#4a4a6a';
            dropZone.style.background = '#1a1a2e';
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.style.borderColor = '#4a4a6a';
            dropZone.style.background = '#1a1a2e';
            
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                selectedFile = files[0];
                fileName.textContent = selectedFile.name;
                fileName.style.display = 'block';
                analyzeBtn.disabled = false;
                hideMessages();
            }
        });
    </script>
</body>
</html>
